name: Source checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python syntax
        run: python -m compileall -q mmdet configs tools tests setup.py
      - name: Shell syntax
        run: for file in scripts/*.sh; do bash -n "$file"; done
